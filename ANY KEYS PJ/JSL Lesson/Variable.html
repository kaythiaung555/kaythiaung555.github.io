<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variable</h1>
    <script>
        // global variable (var)
        var name = "Kay Thi Aung";
        console.log(name);
        var name = "Roi Roi"
        console.log(name);

        // block scope variable (let)
        let fatherName = "U Thaung Sein"
        console.log(fatherName);
        fatherName = "U Thaung"
        console.log(fatherName);

        // const variable (const)
        const motherName = "Daw Hkawn Nan"
        console.log(motherName);
        motherName = "Daw Hkawn"
        console.log(motherName);
    </script>
</body>
</html>
