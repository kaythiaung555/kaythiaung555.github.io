<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operator Lessons</h1>
    <script>
        // assign operator = 
        let name = "Kay Thi Aung"

        // addition Operator +
        let total = 3 + 1;
        console.log(total);

        let result = total + 24;
        console.log(result);

        let three = '777' + 5;
        console.log(three);

        let number = 7;
        // number = number + 3;
        number += 3;
        console.log(number);

        let addNum = 3;
        console.log(addNum++);
        console.log(++addNum);
        console.log(addNum);

        // substration operator - 
        let two = 3-1;
        console.log(two);

        let num1 = 70;
        num1 -= 50;
        // num1 = num1 - 50;
        console.log(num1);

        let num2 = 40;
        console.log(num2--);
        console.log(--num2);
        console.log(num2);

        // Division Operation /
        let div1 = 20/3
        console.log(div1);
        console.log(div1.toFixed(2));

        let div2 = 10
        div2 /= 2;
        console.log(div2);

        // Remainder operator %
        let rem1 = 85456 % 152
        console.log(rem1);

        // multiplaction *
        let mult = 1526*1528
        console.log(mult);

        // Exponentation **
        let exp = 2 ** 6
        console.log(exp);

        // precendence
        let pre = 2 * (2 + 5) / 2 % 2 - 5;
        console.log(pre);
    
    </script>
</body>
</html>
