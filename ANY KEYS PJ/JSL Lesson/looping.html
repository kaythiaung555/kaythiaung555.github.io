<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping</title>
</head>
<body>
    <h1>Looping Lessons</h1>
    <script>
        // For Looping

        document.write("<h3>Hello World</h3>");

        // for (initialize; comparsion; update++) {
        //     // code
        // }

        for(let num = 0; num <= 5; num++){
            document.write(`<h3>Hello World ${num} </h3>`);
        }

        let laptops = ['Dell','Hp','Acer','Lenovo','Asus','Macbook','Fujitsu'];

        for (let i = 0; i < laptops.length; i++){
            document.write(`I Want to Buy ${laptops[i]}<br>`);

        }

        // *
        // **
        // ***

        for(let h = 0; h < 10; h++){
            for(let i = 0; i <= h; i++) {
                document.write(`*`);
            }
            document.write(`<br>`);
        }
        
        for(let h = 10; h > 0; h--){
            for(let i = 10; i => h; i--){
                document.write(`*`);
            }
            document.write(`<br>`);
        }



        // // while looping 
        // while(condition){
        //     // code


        //     // update
        // }


        let num = 300;
        while(num > 100){
            document.write(`Your Number is ${num} <br>`);

            // update
            num -= 5;
        }

        // Do while looping
        // do{
        //     // code


        //     // update

        // } while(condition);


        let no = 10;
        do{
            document.write(`Your Number is ${no} <br>`);


            no -= 2; 
        }while(no > 5);
        

    </script>
</body>
</html>
